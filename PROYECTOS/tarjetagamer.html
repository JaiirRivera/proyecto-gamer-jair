<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Gamer</title>
    <style>
        body{
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(to bottom, #0A0F1F, #111827);
    margin: 0;
    color: white;
}

.contenedor{
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 50px;
}
        nav{
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 20px 50px;
    background-color: rgba(0,0,0,0.2);
    backdrop-filter: blur(10px);
}   
nav a{

    color: white;
    text-decoration: none;
    margin-left: 20px;

}
.btn-principal{

    padding: 15px 40px;
    font-size: 20px;
    border-radius: 10px;

}
        img {
            border-radius: 50%;
            margin-bottom: 20px;
            transform: scale(1.04);
            box-shadow: 0 0 25px #00BFFF;
        }
        h1 {
            color: #00BFFF;
        }
        nav h2 {
            color: #00BFFF;
            }
            a {
                color: #00BFFF; 
                }
        p {
            color: white;
            font-size: 18px;
        }
        .hero{
    max-width: 500px;
}
.hero h1{

    font-size: 70px;
    margin-bottom: 10px;

}
.hero p{

    line-height: 1.7;
    margin-bottom: 30px;

}
        .juego {
            color: #00BFFF;
            font-size: 20px;
            box-shadow: 0 4px 8px aqua;
            font-weight: bold;
            border-radius: 50px;
            transition: 0.3s;
            padding: 8px 20px;
            display: inline-block;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0056b3;
            transform: scale(1.08);
        }
        .tarjeta {
            background-color: #1f2937;;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px aqua;
            display: inline-block;
            transition: 0.3s;
            width: 320px;
            
        }
        .tarjeta:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px aqua;
        }
        @media (max-width: 768px){

}
.contenedor{

    flex-direction: column;

}
.games{

    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 50px;
    flex-wrap: wrap;

}

.game-card{

    background-color: #1f2937;
    padding: 20px;
    width: 220px;
    border-radius: 15px;
    box-shadow: 0 0 15px #00BFFF;
    transition: 0.3s;

}

.game-card:hover{

    transform: translateY(-10px);

}

.game-card h2{

    color: #00BFFF;

} 
@media(max-width: 768px){

    .contenedor{

        flex-direction: column;
        gap: 40px;

    }

    .games{

        flex-direction: column;
        align-items: center;

    }

    .hero h1{

        font-size: 50px;

    }

}
    </style>
</head>
<body>

    <nav>
        <h2>Jair Gamer</h2>
        <a href="hojadevida.html" target="_blank">Ver hoja de vida</a>
    </nav>

    <div class="contenedor">

    <section class="hero">
        <h1>DOFUS</h1>
        <p>El juego de rol en línea más popular de Francia</p>
        <button class="btn-principal">Jugar ahora</button>
    </section>

    <div class="tarjeta">
        <img src="jair.png" alt="Foto de perfil de Jair" width="200">
        <h1>Jaiir Gamer</h1>
        <p>Mi juego favorito es:</p>
        <p class="juego">DOFUS</p>
        <hr>
        <button>Seguir</button>
    </div>

</div>

<section class="games">
    <div class="game-card">
        <h2>Dofus</h2>
        <p>MMORPG estratégico online</p>
    </div>

    <div class="game-card">
        <h2>Minecraft</h2>
        <p>Juego de construcción y aventura</p>
    </div>

    <div class="game-card">
        <h2>Valorant</h2>
        <p>Shooter táctico competitivo</p>
    </div>
</section>

    </div>

</body>
</html>
