<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de pelicula</title>
    <style>
        body{
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(to bottom, #0A0F1F, #111827);
    margin: 0;
        }
        h1{
            color: #00BFFF;
        }
        img {
            border-radius: 50%;
            margin-bottom: 20px;
            transform: scale(1.04);
            box-shadow: 0 0 25px #00BFFF;
            width: 200px;
        }
        p {
            color: white;
            font-size: 18px;
        }
        .tarjeta {
            background-color: #1f2937;
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            margin: 50px auto;
            box-shadow: 0 20px 20px #00BFFF;
            transition: 0.3s;
        }
        .tarjeta:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px #00BFFF;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #00BFFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #00A0E0;
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <img src="culpamia.jpg" alt="foto de perfil">
        <h1>Culpa Mía</h1>
        <p>Una película de drama romántico, en el cual los protagonista se llaman noa y nick</p>
        
        <a href="https://www.primevideo.com/-/es/detail/0S0OIMOTSETYIWA2EVTWWH7JR9" target="_blank">
            <button>Ver ahora</button>
        </a>
    </div>
</body>
</html>
